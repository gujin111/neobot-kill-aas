name = "proactive"
version = "1.0.0"
description = "主动发言调度（空闲 / 活跃度触发）+ 指令图片总览"
author = "ported from koishi-plugin-chatluna-proactive-trigger"
dependencies = []
priority = 0
min_neobot_version = ""
python_dependencies = ["pydantic>=2,<3"]

homepage = ""
license = "MIT"
tags = ["chat", "proactive", "help"]

# 插件本体不持有端口或后台线程之外的长生命周期资源：调度循环用 ctx.create_task，
# 停插件时会被取消，因此支持热重载；配置改动走 config.toml，重载即生效。
hot_reload = true
config_hot_reload = true

# 打包默认值；用户改动写在 plugins_data/proactive/config.toml，升级不丢。
# 注释会被面板渲染成字段说明。
[config]
# 主动发言总开关（运行期也可用 /proactiveon、/proactiveoff 切换）
enabled = true

# 调度器扫描间隔（秒）
tick_seconds = 20

# 默认群聊模板适用的群号列表（配合 guild_id = "default" 的规则使用）
apply_default_group_configs = []

# 默认私聊模板适用的用户 ID 列表
apply_default_private_configs = []

# 群聊规则列表：在面板「配置」里逐条添加
groups = []

# 私聊规则列表：私聊只支持空闲触发
privates = []

# 主动发言失败后的会话冷却时间（秒）
failure_cooldown_seconds = 60

# 连续失败多少次后进入冷却
max_retry_attempts = 3

# 输出触发原因等调试日志
debug_log = false

# 输出每条消息的完整判断快照（排查用，平时建议关闭）
verbose_log = false

# 启用 /helpimg 指令图片总览
help_image_enabled = true

# 指令图片的标题
help_image_title = "NeoBot 指令总览"

# 指令图片主题：default / bottle / game / fortune
help_image_theme = "default"

# 指令图片宽度（像素）
help_image_width = 900

# 在指令图片里显示插件来源标记
help_image_show_source = true

# 单张图片最多渲染多少条指令
help_image_max_rows = 200
