name = "proactive"
version = "1.7.1"
description = "主动发言调度（空闲 / 活跃度触发）+ 指令图片总览"
author = "ported from koishi-plugin-chatluna-proactive-trigger"
dependencies = []
priority = 0
min_neobot_version = ""
python_dependencies = ["pydantic>=2,<3"]

homepage = ""
license = "MIT"
tags = ["chat", "proactive", "help"]

# 插件本体不持有端口或后台线程之外的长生命周期资源：调度循环用 ctx.create_task，
# 停插件时会被取消，因此支持热重载；配置改动走 config.toml，重载即生效。
hot_reload = true
config_hot_reload = true

# 打包默认值；用户改动写在 plugins_data/proactive/config.toml，升级不丢。
# 注释会被面板渲染成字段说明。
[config]
# 主动发言总开关的初始值；之后以 /proactiveon、/proactiveoff 持久化的运行状态为准
enabled = true

# 调度器检查触发条件的频率（秒），不是主动发言的间隔
tick_seconds = 20

# 默认群聊模板适用的群号/会话 ID 列表（需存在 guild_id = "default" 的规则）
apply_default_group_configs = []

# 默认私聊模板适用的 QQ 号/会话 ID 列表（需存在 user_id = "default" 的规则）
apply_default_private_configs = []

# 群聊规则列表：在面板「配置」里逐条添加
groups = []

# 私聊规则列表：私聊只支持空闲触发
privates = []

# 失败达到 max_retry_attempts 次后，后续触发尝试暂停的时间（秒）
failure_cooldown_seconds = 60

# 自上次成功以来失败达到 N 次后进入冷却；0 按 1 处理
max_retry_attempts = 3

# 输出触发成功/失败、跳过原因等 info 日志
debug_log = false

# 输出与 debug_log 相同的 info 日志，并额外输出每条消息的记录日志
verbose_log = false
